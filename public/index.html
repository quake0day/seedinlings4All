<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#f8f8f0" />
<title>Seedlings 🌱</title>
<link rel="stylesheet" href="/animal-ui.css" />
<style>
  /* ============ page-specific layout ============ */
  html[lang="en"] body { font-size:16px; }
  html[lang="en"] .card h3 { font-size:17px; }
  html[lang="en"] .variety, html[lang="en"] .desc { font-size:14px; }
  html[lang="en"] .stock { font-size:14px; }
  html[lang="en"] .desc { max-height:none; overflow:visible; }
  html[lang="en"] .desc::after { display:none; }
  html[lang="en"] .desc-toggle { display:none; }
  body { font-size:22px; }

  body.big { font-size:28px; }
  body.big .card h3 { font-size:26px; }
  body.big .variety { font-size:20px; }
  body.big .desc { font-size:20px; }
  body.big .stock { font-size:19px; }
  body.big .add { font-size:19px; }
  body.big header h1 { font-size:28px; }
  body.big .cat-title { font-size:28px; }
  body.big .checkout input, body.big .checkout textarea { font-size:20px; }
  body.big .item .info { font-size:20px; }
  body.big .qty button { width:40px; height:40px; font-size:22px; }

  /* header extras */
  header { position:sticky; top:0; z-index:30; }
  .big-btn, .my-btn {
    display:inline-flex; align-items:center; gap:6px;
    background:#fff3c0; border:2.5px solid var(--ac-warning);
    color:#846200; font-weight:700;
    padding:0 14px; height:38px;
    border-radius: var(--ac-radius-pill);
    box-shadow: 0 3px 0 0 var(--ac-warning-active);
    cursor:pointer; font-size:13px;
    transition: transform .2s, box-shadow .2s;
  }
  .big-btn:hover, .my-btn:hover { transform:translateY(-1px); box-shadow:0 4px 0 0 var(--ac-warning-active); }
  .big-btn:active, .my-btn:active { transform:translateY(2px); box-shadow:0 1px 0 0 var(--ac-warning-active); }
  .big-btn.on { background:var(--ac-warning); color:#fff; }
  .my-btn { background:#dff4ff; border-color:#60b3e2; color:#1e5a83; box-shadow:0 3px 0 0 #3b8ebf; }
  .my-btn:hover { box-shadow:0 4px 0 0 #3b8ebf; }
  .my-btn:active { box-shadow:0 1px 0 0 #3b8ebf; }

  .lang {
    display:inline-flex; align-items:center; gap:4px;
    background:#fffdf5; border:2.5px solid var(--ac-border-soft); color:var(--ac-text);
    padding:0 14px; height:38px; border-radius:var(--ac-radius-pill);
    text-decoration:none; font-weight:700; font-size:13px;
    box-shadow: 0 3px 0 0 var(--ac-shadow-3d-soft);
    transition: transform .2s, box-shadow .2s;
  }
  .lang:hover { transform:translateY(-1px); box-shadow:0 4px 0 0 var(--ac-shadow-3d-soft); color:var(--ac-primary-active); }

  #cartBtn {
    display:inline-flex; align-items:center; gap:6px;
    background:#ffe9a8; border:2.5px solid var(--ac-warning);
    color:#845806; font-weight:800;
    padding:0 16px; height:38px;
    border-radius: var(--ac-radius-pill);
    box-shadow: 0 3px 0 0 var(--ac-warning-active);
    cursor:pointer; font-size:13px;
    transition: transform .2s, box-shadow .2s;
  }
  #cartBtn:hover { transform:translateY(-1px); box-shadow:0 4px 0 0 var(--ac-warning-active); }
  #cartBtn:active { transform:translateY(2px); box-shadow:0 1px 0 0 var(--ac-warning-active); }
  #cartBtn.has-items {
    animation: cartPulse 1.6s ease-in-out infinite;
    background:#ffd77a;
  }
  @keyframes cartPulse {
    0%,100% { box-shadow: 0 3px 0 0 var(--ac-warning-active), 0 0 0 0 rgba(245,195,28,.6); }
    50%     { box-shadow: 0 3px 0 0 var(--ac-warning-active), 0 0 0 10px rgba(245,195,28,0); }
  }

  /* Sticky category bar */
  .cat-bar {
    position:sticky; top:62px; z-index:25;
    padding:10px 12px 10px;
    margin:0 -12px 6px;
    overflow-x:auto; white-space:nowrap; -webkit-overflow-scrolling:touch;
    background: linear-gradient(180deg, #fffdf5f0, #fffdf5cc);
    border-bottom: 2px solid var(--ac-border-soft);
    backdrop-filter: blur(4px);
  }
  .cat-bar::-webkit-scrollbar { display:none; }
  .cat-chip {
    display:inline-flex; align-items:center;
    padding: 0 16px; height:34px;
    margin-right:8px;
    background:#fffdf5;
    border:2.5px solid var(--ac-border-soft);
    border-radius:var(--ac-radius-pill);
    color:var(--ac-text); font-size:13px; font-weight:700;
    cursor:pointer; text-decoration:none;
    box-shadow: 0 3px 0 0 var(--ac-shadow-3d-soft);
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .cat-chip:hover { transform:translateY(-1px); box-shadow:0 4px 0 0 var(--ac-shadow-3d-soft); }
  .cat-chip.active {
    background:var(--ac-primary); border-color:var(--ac-primary); color:#fff;
    box-shadow:0 3px 0 0 var(--ac-primary-active);
  }

  main { max-width: 1100px; margin: 0 auto; padding: 20px; }
  .grid { display:block; }
  .cat-title {
    color:var(--ac-text);
    font-size:24px;
    margin:30px 0 14px;
    padding:6px 0 8px;
    scroll-margin-top:140px;
    position:relative;
    border-bottom: 3px dashed var(--ac-border-soft);
  }
  .cat-title::before { content: "🌿  "; }

  .cat-grid {
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap:18px;
  }
  .card {
    background:#fff;
    border:2.5px solid var(--ac-border-soft);
    border-radius: var(--ac-radius-lg);
    overflow:hidden;
    box-shadow: 0 5px 0 0 var(--ac-shadow-3d-soft);
    display:flex; flex-direction:column;
    position:relative;
    transition: transform .2s var(--ac-ease), box-shadow .2s var(--ac-ease);
  }
  .card:hover { transform:translateY(-2px); box-shadow:0 7px 0 0 var(--ac-shadow-3d-soft); }
  .card .img-wrap { position:relative; cursor:zoom-in; }
  .card img { width:100%; height:200px; object-fit:cover; background:#f4edd2; display:block; }
  .ph { height:200px; display:flex; align-items:center; justify-content:center; background:linear-gradient(135deg,#f4edd2,#e9e0c4); font-size:52px; }
  .body { padding:14px 16px 16px; flex:1; display:flex; flex-direction:column; }
  .body h3 { margin:0 0 6px; font-size:19px; font-weight:800; }
  .variety { color:var(--ac-text-2); font-size:14px; margin-bottom:8px; font-weight:600; }
  .desc { font-size:14px; color:#5a4528; flex:1; white-space:pre-wrap; line-height:1.55; max-height:11em; overflow:hidden; position:relative; }
  .desc.expanded { max-height:none; }
  .desc::after { content:""; position:absolute; bottom:0; left:0; right:0; height:1.6em; background:linear-gradient(transparent,#fff); pointer-events:none; }
  .desc.expanded::after { display:none; }
  .desc-toggle { color:var(--ac-primary-active); font-weight:700; font-size:13px; cursor:pointer; margin-top:4px; user-select:none; }
  @media (min-width: 601px) {
    .desc { max-height:none; }
    .desc::after { display:none; }
    .desc-toggle { display:none; }
  }
  .row { display:flex; align-items:center; justify-content:space-between; margin-top:12px; gap:8px; }
  .stock { font-size:13px; font-weight:700; color:var(--ac-text-2); }
  .stock.low { color:var(--ac-error); }
  .add {
    display:inline-flex; align-items:center; justify-content:center;
    background:var(--ac-primary); color:#fff; border:2px solid var(--ac-primary);
    height:38px; padding:0 18px;
    border-radius: var(--ac-radius-pill);
    cursor:pointer;
    font-family:var(--ac-font); font-size:14px; font-weight:700;
    box-shadow: 0 4px 0 0 var(--ac-primary-active);
    transition: transform .15s, box-shadow .15s, background .15s;
  }
  .add:hover:not(:disabled) { transform:translateY(-1px); box-shadow:0 5px 0 0 var(--ac-primary-active); background:var(--ac-primary-hover); }
  .add:active:not(:disabled) { transform:translateY(3px); box-shadow:0 1px 0 0 var(--ac-primary-active); }
  .add:disabled { background:#cfc4a8; border-color:#cfc4a8; color:#fff; box-shadow:0 4px 0 0 #a89878; opacity:.6; cursor:not-allowed; }

  /* Badges */
  .badges { position:absolute; top:10px; left:10px; display:flex; flex-direction:column; gap:6px; z-index:2; }
  .tag {
    padding: 4px 12px;
    border-radius: var(--ac-radius-pill);
    font-size:11px; font-weight:800; letter-spacing:.02em;
    border: 2px solid;
    box-shadow: 0 2px 0 0 rgba(0,0,0,.15);
  }
  .tag.low { background:#ffd6d6; color:#8a2323; border-color:var(--ac-error); animation:pulse 1.5s ease-in-out infinite; }
  .tag.out { background:#ddd5c2; color:#5a4528; border-color:var(--ac-border); }
  .tag.new { background:#fff3c0; color:#846200; border-color:var(--ac-warning); }
  @keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.06);} }

  /* Skeleton loaders */
  .skel-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:18px; }
  .skel {
    background:#fff; border:2.5px solid var(--ac-border-soft); border-radius:var(--ac-radius-lg);
    box-shadow:0 5px 0 0 var(--ac-shadow-3d-soft); overflow:hidden;
  }
  .skel-img { height:200px; background:linear-gradient(90deg,#f4edd2 25%,#fdf8e0 50%,#f4edd2 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; }
  .skel-line { height:14px; margin:12px; border-radius:8px; background:linear-gradient(90deg,#f4edd2 25%,#fdf8e0 50%,#f4edd2 75%); background-size:200% 100%; animation:shimmer 1.4s infinite; }
  .skel-line.short { width:60%; }
  @keyframes shimmer { 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }

  /* Drawer */
  .mask { position:fixed; inset:0; background:rgba(60,48,28,.4); display:none; z-index:40; }
  .mask.show { display:block; }
  .drawer {
    position:fixed; right:0; top:0; bottom:0; width:min(460px,100%);
    background:#fffdf5;
    border-left:2.5px solid var(--ac-border-soft);
    transform:translateX(100%); transition:transform .25s var(--ac-ease);
    z-index:41; display:flex; flex-direction:column;
    box-shadow: -8px 0 24px rgba(61,52,40,.18);
  }
  .drawer.show { transform:none; }
  .drawer-head {
    display:flex; align-items:center; gap:10px; padding:14px 16px;
    border-bottom:2px solid var(--ac-border-soft);
    background:#f5efd9;
  }
  .drawer-head h2 { margin:0; font-size:20px; flex:1; color:var(--ac-text); }
  .back-btn {
    background:#fffdf5; color:var(--ac-primary-active);
    border:2.5px solid var(--ac-primary);
    padding:0 14px; height:34px;
    border-radius:var(--ac-radius-pill);
    cursor:pointer; font-size:13px; font-weight:700;
    box-shadow: 0 3px 0 0 var(--ac-primary-active);
    transition: transform .15s, box-shadow .15s;
  }
  .back-btn:hover { transform:translateY(-1px); box-shadow:0 4px 0 0 var(--ac-primary-active); }
  .back-btn:active { transform:translateY(2px); box-shadow:0 1px 0 0 var(--ac-primary-active); }

  .items { flex:1; overflow:auto; padding:12px 16px; }
  .item { display:flex; align-items:center; gap:10px; margin-bottom:14px; padding:10px; background:#fffdf5; border:2px solid var(--ac-border-soft); border-radius:var(--ac-radius); }
  .item img, .item .item-ph { width:60px; height:60px; object-fit:cover; border-radius:12px; flex-shrink:0; background:#f4edd2; }
  .item .item-ph { display:flex; align-items:center; justify-content:center; font-size:32px; }
  .item .info { flex:1; font-size:15px; min-width:0; color:var(--ac-text); }
  .item .info .nm { font-weight:700; }
  .item .info .vr { color:var(--ac-text-2); font-size:12px; font-weight:600; }
  .qty { display:flex; align-items:center; gap:8px; }
  .qty button {
    width:32px; height:32px; border:2px solid var(--ac-border-soft);
    background:#fffdf5; color:var(--ac-text);
    border-radius:50%; cursor:pointer; font-size:15px; font-weight:800;
    box-shadow: 0 3px 0 0 var(--ac-shadow-3d-soft);
    transition: transform .1s, box-shadow .1s;
  }
  .qty button:hover { transform:translateY(-1px); box-shadow:0 4px 0 0 var(--ac-shadow-3d-soft); }
  .qty button:active { transform:translateY(2px); box-shadow:0 1px 0 0 var(--ac-shadow-3d-soft); }
  .qty span { min-width:24px; text-align:center; font-weight:800; color:var(--ac-text); }

  .cart-summary {
    padding:14px 16px; background:#f0e8d8;
    border-top:2px solid var(--ac-border-soft);
    font-size:15px; font-weight:800;
    color:var(--ac-text);
    display:flex; justify-content:space-between;
  }
  .checkout { padding:14px 16px; border-top:2px solid var(--ac-border-soft); background:#fffdf5; }
  .checkout-fields label { display:block; font-size:12px; color:var(--ac-text-2); margin:8px 0 4px; font-weight:700; letter-spacing:.02em; }
  .checkout input, .checkout textarea {
    width:100%;
    font-family: var(--ac-font);
    font-size:15px; font-weight:500; color:var(--ac-text);
    background:var(--ac-bg-input);
    border:2.5px solid var(--ac-border-soft);
    border-radius:var(--ac-radius-pill);
    padding:0 16px; height:42px;
    outline:none;
    box-shadow: 0 3px 0 0 var(--ac-shadow-3d-soft);
    transition: border-color .2s, box-shadow .2s;
    margin-bottom:4px;
  }
  .checkout textarea {
    height:auto; padding:10px 16px; border-radius:var(--ac-radius); resize:vertical; min-height:60px;
  }
  .checkout input:focus, .checkout textarea:focus {
    border-color:#ffcc00;
    box-shadow:0 3px 0 0 #e0b800, 0 0 0 3px rgba(255,204,0,.15);
  }
  .checkout button.submit {
    width:100%; margin-top:14px;
    background:var(--ac-success); color:#fff;
    border:2px solid var(--ac-success);
    padding:0; height:52px;
    border-radius:var(--ac-radius-pill);
    font-family:var(--ac-font); font-size:17px; font-weight:800;
    cursor:pointer;
    box-shadow: 0 5px 0 0 var(--ac-success-active);
    transition: transform .15s, box-shadow .15s;
  }
  .checkout button.submit:hover { transform:translateY(-1px); box-shadow:0 6px 0 0 var(--ac-success-active); }
  .checkout button.submit:active { transform:translateY(3px); box-shadow:0 1px 0 0 var(--ac-success-active); }

  /* Empty states */
  .empty { text-align:center; color:var(--ac-text-2); padding:30px 12px; font-weight:600; }
  .empty .ico { font-size:60px; display:block; margin-bottom:10px; opacity:.7; }
  .empty button {
    background:var(--ac-primary); color:#fff;
    border:2px solid var(--ac-primary); padding:0 22px; height:40px;
    border-radius:var(--ac-radius-pill);
    cursor:pointer; font-family:var(--ac-font); font-size:14px; font-weight:700;
    box-shadow:0 4px 0 0 var(--ac-primary-active);
    margin-top:10px;
    transition: transform .15s, box-shadow .15s;
  }
  .empty button:hover { transform:translateY(-1px); box-shadow:0 5px 0 0 var(--ac-primary-active); }
  .empty button:active { transform:translateY(3px); box-shadow:0 1px 0 0 var(--ac-primary-active); }

  .badge {
    display:inline-flex; align-items:center; justify-content:center;
    min-width:20px; height:20px; padding:0 6px;
    background:var(--ac-error); color:#fff;
    border-radius:10px; border:2px solid #fff;
    font-size:11px; font-weight:800;
    margin-left:4px;
  }

  /* Lightbox */
  .lightbox { position:fixed; inset:0; background:rgba(30,22,10,.92); display:none; align-items:center; justify-content:center; z-index:100; padding:20px; cursor:zoom-out; }
  .lightbox.show { display:flex; }
  .lightbox img { max-width:100%; max-height:100%; border-radius:12px; box-shadow:0 8px 40px rgba(0,0,0,.5); border:3px solid #fffdf5; }
  .lightbox .close {
    position:absolute; top:18px; right:22px;
    color:var(--ac-text); background:#fffdf5;
    width:44px; height:44px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:24px; cursor:pointer; line-height:1; user-select:none;
    border:2.5px solid var(--ac-border-soft);
    box-shadow:0 4px 0 0 var(--ac-shadow-3d-soft);
    font-weight:800;
  }

  /* Toast */
  #toast {
    position:fixed; left:50%; bottom:32px;
    transform:translateX(-50%) translateY(20px);
    background:#fffdf5; color:var(--ac-text);
    padding:12px 22px;
    border:2.5px solid var(--ac-border-soft); border-radius:var(--ac-radius-pill);
    font-size:15px; font-weight:700;
    box-shadow:0 5px 0 0 var(--ac-shadow-3d-soft), 0 10px 24px rgba(61,52,40,.2);
    opacity:0; pointer-events:none;
    transition:all .25s var(--ac-ease);
    z-index:50; max-width:92%;
  }
  #toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

  /* Receipt modal */
  .modal {
    position:fixed; inset:0; background:rgba(60,48,28,.5);
    display:flex; align-items:center; justify-content:center;
    z-index:99; padding:16px; backdrop-filter:blur(2px);
  }
  .receipt {
    background:#fffdf5;
    border:2.5px solid var(--ac-border-soft);
    border-radius:var(--ac-radius-lg);
    padding:0;
    max-width:480px; width:100%;
    max-height:90vh; overflow:auto;
    box-shadow: 0 10px 0 0 var(--ac-shadow-3d-soft), 0 20px 50px rgba(61,52,40,.3);
  }
  .receipt-head {
    background:linear-gradient(135deg,#d3f4ea,#baf0e0);
    color:var(--ac-text);
    padding:24px; text-align:center;
    border-bottom:2px solid var(--ac-border-soft);
    border-radius:calc(var(--ac-radius-lg) - 2px) calc(var(--ac-radius-lg) - 2px) 0 0;
  }
  .receipt-head .check { font-size:56px; }
  .receipt-head h2 { margin:6px 0 0; font-size:22px; color:var(--ac-text); }
  .receipt-body { padding:20px 22px; }
  .receipt-body .label {
    font-size:12px; color:var(--ac-text-2);
    text-transform:uppercase; letter-spacing:1px;
    margin-top:14px; margin-bottom:6px; font-weight:800;
  }
  .receipt-body .url {
    background:#f5efd9; border:2px dashed var(--ac-border-soft);
    padding:12px 14px; border-radius:var(--ac-radius);
    font-size:13px; word-break:break-all; color:var(--ac-text);
    font-family:Menlo,Consolas,monospace;
  }
  .receipt-body .pw {
    background:#fff3c0; border:2.5px solid var(--ac-warning);
    padding:16px; border-radius:var(--ac-radius);
    font-size:30px; font-weight:900; text-align:center; letter-spacing:8px;
    color:#7a5a00; font-family:Menlo,Consolas,monospace;
    box-shadow:0 3px 0 0 var(--ac-warning-active);
  }
  .receipt-actions { display:flex; gap:10px; padding:0 22px 20px; }
  .receipt-actions button {
    flex:1; border:none; padding:0; height:46px;
    border-radius:var(--ac-radius-pill);
    font-family:var(--ac-font); font-size:15px; font-weight:800;
    cursor:pointer;
    transition:transform .15s, box-shadow .15s;
  }
  .receipt-actions .copy {
    background:var(--ac-primary); color:#fff; border:2px solid var(--ac-primary);
    box-shadow:0 4px 0 0 var(--ac-primary-active);
  }
  .receipt-actions .copy:hover { transform:translateY(-1px); box-shadow:0 5px 0 0 var(--ac-primary-active); }
  .receipt-actions .copy:active { transform:translateY(3px); box-shadow:0 1px 0 0 var(--ac-primary-active); }
  .receipt-actions .copy.done { background:var(--ac-success); border-color:var(--ac-success); box-shadow:0 4px 0 0 var(--ac-success-active); }
  .receipt-actions .ok {
    background:#fffdf5; color:var(--ac-text); border:2.5px solid var(--ac-border-soft);
    box-shadow:0 4px 0 0 var(--ac-shadow-3d-soft);
  }
  .receipt-actions .ok:hover { transform:translateY(-1px); box-shadow:0 5px 0 0 var(--ac-shadow-3d-soft); }
  .receipt-actions .ok:active { transform:translateY(3px); box-shadow:0 1px 0 0 var(--ac-shadow-3d-soft); }
  .receipt-tip { padding:0 22px 18px; font-size:13px; color:var(--ac-text-2); text-align:center; font-weight:600; }

  /* My orders */
  .orders-list { padding:18px 22px; }
  .order-row {
    padding:14px;
    border:2px solid var(--ac-border-soft);
    border-radius:var(--ac-radius);
    margin-bottom:10px; cursor:pointer;
    background:#fffdf5;
    box-shadow:0 3px 0 0 var(--ac-shadow-3d-soft);
    transition:transform .15s, box-shadow .15s, background .15s;
  }
  .order-row:hover { transform:translateY(-1px); box-shadow:0 4px 0 0 var(--ac-primary-active); border-color:var(--ac-primary); background:#fffffa; }
  .order-row .oid { font-weight:800; color:var(--ac-primary-active); font-size:15px; }
  .order-row .meta { font-size:12px; color:var(--ac-text-2); margin-top:4px; }
  .order-row .sum { font-size:13px; color:var(--ac-text); margin-top:6px; }

  /* Mobile overrides */
  @media (max-width: 600px) {
    main { padding:14px; }
    .cat-bar { top:58px; padding:8px 12px; margin:0 -14px 6px; }
    .cat-grid { grid-template-columns:repeat(auto-fill, minmax(160px, 1fr)); gap:12px; }
    .card img, .ph { height:150px; }
    .body { padding:10px 12px 12px; }
    .body h3 { font-size:16px; }
    .skel-img { height:150px; }
    .skel-grid { grid-template-columns:repeat(auto-fill, minmax(160px,1fr)); gap:12px; }
    .big-btn .lbl, .my-btn .lbl { display:none; }
    .big-btn, .my-btn { padding:0 10px; font-size:13px; }
    #cartBtn { padding:0 12px; font-size:13px; }
    .lang { padding:0 10px; font-size:12px; }
    .cat-title { font-size:20px; margin:20px 0 10px; }
    body.big .cat-title { font-size:24px; }
  }
</style>
</head>
<body class="ac-island">
<header class="ac-header">
  <h1 id="title">🌱 Seedlings Shop</h1>
  <button class="big-btn" id="bigBtn" type="button" title="Large text / 大字">🔍 <span class="lbl" id="bigLabel">Large text</span></button>
  <button class="my-btn" id="myBtn" type="button" title="My orders / 我的订单">📋 <span class="lbl" id="myLabel">My orders</span></button>
  <a class="lang" id="langLink" href="/cn">🌐 中文</a>
  <button id="cartBtn">🧺 <span id="cartLabel">Cart</span> <span class="badge" id="cartCount">0</span></button>
</header>
<main>
  <nav class="cat-bar" id="catBar" style="display:none;"></nav>
  <div class="grid" id="grid"></div>
</main>

<div class="mask" id="mask"></div>
<aside class="drawer" id="drawer" aria-label="Cart">
  <div class="drawer-head">
    <button class="back-btn" id="backBtn" type="button">← <span id="backLabel">Keep shopping</span></button>
    <h2 id="cartTitle">My Cart</h2>
  </div>
  <div class="items" id="cartItems"></div>
  <div class="cart-summary" id="cartSummary" style="display:none;"></div>
  <div class="checkout">
    <div class="checkout-fields">
      <label for="buyer" id="buyerLabel"></label>
      <input id="buyer" />
      <label for="contact" id="contactLabel"></label>
      <input id="contact" />
      <label for="note" id="noteLabel"></label>
      <textarea id="note" rows="2"></textarea>
    </div>
    <button class="submit" id="submitBtn"></button>
  </div>
</aside>

<div class="lightbox" id="lightbox"><span class="close">×</span><img id="lightboxImg" alt=""></div>
<div id="toast"></div>

<script>
const LANG = location.pathname.startsWith('/cn') ? 'zh' : 'en';
const T = {
  en: {
    title: "🌱 Si Chen & Yuan Yuan's Seedling Shop", cart: 'Cart', cartTitle: 'My Cart',
    soldOut: 'Sold out', addCart: 'Add to cart', stock: 'In stock',
    onlyN: (n) => `Only ${n} left!`,
    buyerLbl: 'Your name *', buyer: 'e.g. Anna',
    contactLbl: 'Contact', contact: 'WeChat / phone',
    noteLbl: 'Notes', note: 'Pickup time / place / requests',
    submit: 'Place order', empty: "No seedlings yet — check back soon~",
    cartEmpty: 'Your cart is empty', goShopping: 'Go shopping',
    noStock: 'Not enough stock', needName: 'Please enter your name', needItems: 'Your cart is empty',
    bigOn: 'Normal text', bigOff: 'Large text', back: 'Keep shopping',
    myOrders: 'My orders', myEmpty: "No saved orders yet — they'll show up here after you check out",
    addedToast: (n) => `Added "${n}"  ✓`,
    success: 'Order placed!',
    yourLink: 'Your order link', yourPw: 'Password',
    copy: 'Copy link & password', copied: 'Copied ✓',
    receiptTip: 'Save this — you can also find it later under "📋 My orders"',
    totalCount: (n) => `${n} item${n!==1?'s':''}`,
    expand: 'Read more', collapse: 'Show less',
    langSwap: '🌐 中文', langHref: '/cn'
  },
  zh: {
    title: '🌱 陈思远远的菜苗小铺', cart: '购物车', cartTitle: '我的购物车',
    soldOut: '已售罄', addCart: '加入购物车', stock: '库存',
    onlyN: (n) => `仅剩 ${n} 株!`,
    buyerLbl: '你的名字 *', buyer: '例如:小红',
    contactLbl: '联系方式', contact: '微信号 / 电话',
    noteLbl: '备注', note: '取货时间 / 地点 / 要求',
    submit: '提交订单', empty: '还没有菜苗,等老板上架~',
    cartEmpty: '购物车空空如也', goShopping: '去逛逛',
    noStock: '库存不足', needName: '请填写你的名字', needItems: '购物车是空的',
    bigOn: '正常字号', bigOff: '大字模式', back: '继续选购',
    myOrders: '我的订单', myEmpty: '还没有保存的订单 — 下单后会自动出现在这里',
    addedToast: (n) => `已添加「${n}」 ✓`,
    success: '下单成功!',
    yourLink: '你的订单链接', yourPw: '查看密码',
    copy: '复制链接和密码', copied: '已复制 ✓',
    receiptTip: '请保存好,你也可以稍后在 "📋 我的订单" 里找回',
    totalCount: (n) => `共 ${n} 株`,
    expand: '展开全文', collapse: '收起',
    langSwap: '🌐 English', langHref: '/'
  }
}[LANG];

document.documentElement.lang = LANG === 'zh' ? 'zh-CN' : 'en';
document.title = T.title;
document.getElementById('title').textContent = T.title;
document.getElementById('cartLabel').textContent = T.cart;
document.getElementById('cartTitle').textContent = T.cartTitle;
document.getElementById('buyer').placeholder = T.buyer;
document.getElementById('contact').placeholder = T.contact;
document.getElementById('note').placeholder = T.note;
document.getElementById('buyerLabel').textContent = T.buyerLbl;
document.getElementById('contactLabel').textContent = T.contactLbl;
document.getElementById('noteLabel').textContent = T.noteLbl;
document.getElementById('submitBtn').textContent = T.submit;
document.getElementById('myLabel').textContent = T.myOrders;
const langLink = document.getElementById('langLink');
langLink.textContent = T.langSwap;
langLink.href = T.langHref;

let seedlings = [];
let lastSeedlingsHash = '';
const cart = {};
const expanded = new Set();
let firstLoad = true;

const pick = (s, key) => LANG==='zh' ? (s[key+'_zh']||s[key+'_en']||'') : (s[key+'_en']||s[key+'_zh']||'');
const pickCat = (c) => {
  if (!c) return '';
  const parts = c.split('/').map(x=>x.trim()).filter(Boolean);
  if (parts.length >= 2) return LANG === 'zh' ? parts[1] : parts[0];
  return parts[0] || '';
};
function esc(s){return String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
const slug = (s) => 'cat-' + (s||'').replace(/[^\w\u4e00-\u9fa5]/g,'-').toLowerCase();

async function load() {
  if (firstLoad) {
    document.getElementById('grid').innerHTML = `<div class="skel-grid">${Array.from({length:6}).map(()=>'<div class="skel"><div class="skel-img"></div><div class="skel-line"></div><div class="skel-line short"></div></div>').join('')}</div>`;
  }
  const r = await fetch('/api/seedlings');
  const next = await r.json();
  const hash = JSON.stringify(next.map(s=>[s.id,s.stock,s.image,s.name_en,s.name_zh,s.description_en,s.description_zh,s.category,s.sort_order]));
  const changed = hash !== lastSeedlingsHash;
  seedlings = next;
  if (changed || firstLoad) {
    lastSeedlingsHash = hash;
    firstLoad = false;
    render();
  } else {
    for (const s of seedlings) {
      const card = document.querySelector(`.card[data-id="${s.id}"]`);
      if (!card) continue;
      const stockEl = card.querySelector('.stock');
      if (stockEl) {
        stockEl.textContent = `${T.stock}: ${s.stock}`;
        stockEl.classList.toggle('low', s.stock <= 3);
      }
      const inCart = cart[s.id] || 0;
      const remaining = s.stock - inCart;
      const btn = card.querySelector('.add');
      if (btn) {
        btn.disabled = remaining <= 0;
        btn.textContent = remaining <= 0 ? T.soldOut : T.addCart;
      }
    }
    updateCartUI();
  }
}

function render() {
  const g = document.getElementById('grid');
  if (seedlings.length === 0) {
    g.innerHTML = `<p class="empty"><span class="ico">🌱</span>${T.empty}</p>`;
    document.getElementById('catBar').style.display = 'none';
    updateCartUI();
    return;
  }
  const groups = {}; const order = [];
  for (const s of seedlings) {
    const cat = pickCat(s.category);
    if (!(cat in groups)) { groups[cat] = []; order.push(cat); }
    groups[cat].push(s);
  }

  const bar = document.getElementById('catBar');
  if (order.length > 1) {
    bar.style.display = 'block';
    bar.innerHTML = order.map(cat => `<a class="cat-chip" href="#${slug(cat)}" data-cat="${slug(cat)}">${esc(cat)||'•'}</a>`).join('');
    bar.querySelectorAll('.cat-chip').forEach(chip => {
      chip.addEventListener('click', e => {
        e.preventDefault();
        const target = document.getElementById(chip.dataset.cat);
        if (target) target.scrollIntoView({ behavior:'smooth', block:'start' });
      });
    });
  } else { bar.style.display = 'none'; }

  g.innerHTML = order.map(cat => {
    const items = groups[cat].map(s => {
      const inCart = cart[s.id] || 0;
      const remaining = s.stock - inCart;
      const lowBadge = (s.stock > 0 && s.stock <= 3) ? `<span class="tag low">${T.onlyN(s.stock)}</span>` : '';
      const outBadge = s.stock === 0 ? `<span class="tag out">${T.soldOut}</span>` : '';
      const desc = esc(pick(s,'description'));
      const isExpanded = expanded.has(s.id);
      return `
      <div class="card" data-id="${s.id}">
        <div class="badges">${outBadge}${lowBadge}</div>
        <div class="img-wrap" onclick="openLightbox(${s.id})">
          ${s.image ? `<img loading="lazy" src="${s.image}" alt="${esc(pick(s,'name'))}">` : `<div class="ph">🌱</div>`}
        </div>
        <div class="body">
          <h3>${esc(pick(s,'name'))}</h3>
          <div class="variety">${esc(pick(s,'variety'))}</div>
          <div class="desc${isExpanded?' expanded':''}" id="desc-${s.id}">${desc}</div>
          <div class="desc-toggle" id="tog-${s.id}" onclick="toggleDesc(${s.id})" style="display:none;">${isExpanded?T.collapse:T.expand}</div>
          <div class="row">
            <span class="stock ${s.stock<=3?'low':''}">${T.stock}: ${s.stock}</span>
            <button class="add" ${remaining<=0?'disabled':''} onclick="addCart(${s.id})">
              ${remaining<=0?T.soldOut:T.addCart}
            </button>
          </div>
        </div>
      </div>`;
    }).join('');
    const heading = cat ? `<h2 class="cat-title" id="${slug(cat)}">${esc(cat)}</h2>` : '';
    return `${heading}<div class="cat-grid">${items}</div>`;
  }).join('');
  requestAnimationFrame(() => {
    document.querySelectorAll('.desc').forEach(d => {
      const id = d.id.replace('desc-','');
      const tog = document.getElementById('tog-'+id);
      if (!tog) return;
      const overflowing = d.scrollHeight > d.clientHeight + 2;
      if (overflowing || expanded.has(+id)) tog.style.display = 'block';
    });
  });
  updateCartUI();
}

function toggleDesc(id) {
  if (expanded.has(id)) expanded.delete(id);
  else expanded.add(id);
  const el = document.getElementById('desc-'+id);
  if (!el) return;
  el.classList.toggle('expanded');
  const tog = el.nextElementSibling;
  if (tog && tog.classList.contains('desc-toggle')) {
    tog.textContent = expanded.has(id) ? T.collapse : T.expand;
  }
}

function openLightbox(id) {
  const s = seedlings.find(x=>x.id===id);
  if (!s || !s.image) return;
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = s.image;
  lb.classList.add('show');
  history.pushState({ lightbox: true }, '', location.href);
}
function closeLightbox(fromPop) {
  const lb = document.getElementById('lightbox');
  if (!lb.classList.contains('show')) return;
  lb.classList.remove('show');
  if (!fromPop && history.state && history.state.lightbox) history.back();
}
document.getElementById('lightbox').onclick = () => closeLightbox(false);

let toastTimer;
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

function addCart(id) {
  const s = seedlings.find(x=>x.id===id);
  const cur = cart[id]||0;
  if (cur+1 > s.stock) { showToast(T.noStock); return; }
  cart[id] = cur+1;
  showToast(T.addedToast(pick(s,'name')));
  render();
}
function changeQty(id, d) {
  const s = seedlings.find(x=>x.id===id);
  const next = (cart[id]||0)+d;
  if (next<=0) delete cart[id];
  else if (next>s.stock) { showToast(T.noStock); return; }
  else cart[id]=next;
  render();
}

function updateCartUI() {
  const ids = Object.keys(cart);
  const total = ids.reduce((a,k)=>a+cart[k],0);
  document.getElementById('cartCount').textContent = total;
  document.getElementById('cartBtn').classList.toggle('has-items', total > 0);
  const summary = document.getElementById('cartSummary');
  const box = document.getElementById('cartItems');
  if (ids.length===0) {
    summary.style.display = 'none';
    box.innerHTML = `<div class="empty"><span class="ico">🧺</span>${T.cartEmpty}<br><button onclick="closeCart(false)">${T.goShopping}</button></div>`;
    return;
  }
  summary.style.display = 'flex';
  summary.innerHTML = `<span>${T.totalCount(total)}</span><span>${ids.length} ${LANG==='zh'?'品种':'kinds'}</span>`;
  box.innerHTML = ids.map(id=>{
    const s = seedlings.find(x=>x.id==id); if (!s) return '';
    return `<div class="item">
      ${s.image?`<img src="${s.image}">`:'<div class="item-ph">🌱</div>'}
      <div class="info"><div class="nm">${esc(pick(s,'name'))}</div><div class="vr">${esc(pick(s,'variety'))}</div></div>
      <div class="qty">
        <button onclick="changeQty(${s.id},-1)">−</button><span>${cart[id]}</span><button onclick="changeQty(${s.id},1)">+</button>
      </div>
    </div>`;
  }).join('');
}

function openCart() {
  if (document.getElementById('drawer').classList.contains('show')) return;
  document.getElementById('drawer').classList.add('show');
  document.getElementById('mask').classList.add('show');
  history.pushState({ cart: true }, '', location.href);
}
function closeCart(fromPop) {
  document.getElementById('drawer').classList.remove('show');
  document.getElementById('mask').classList.remove('show');
  if (!fromPop && history.state && history.state.cart) history.back();
}
window.addEventListener('popstate', () => {
  if (document.getElementById('lightbox').classList.contains('show')) { closeLightbox(true); return; }
  if (document.getElementById('drawer').classList.contains('show')) closeCart(true);
});
document.getElementById('cartBtn').onclick = openCart;
document.getElementById('mask').onclick = () => closeCart(false);
document.getElementById('backBtn').onclick = () => closeCart(false);
document.getElementById('backLabel').textContent = T.back;

document.getElementById('submitBtn').onclick = async ()=>{
  const buyer = document.getElementById('buyer').value.trim();
  if (!buyer) { showToast(T.needName); document.getElementById('buyer').focus(); return; }
  const items = Object.keys(cart).map(id=>({id:+id, qty:cart[id]}));
  if (items.length===0) { showToast(T.needItems); return; }
  const r = await fetch('/api/checkout', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({
      buyer_name: buyer,
      contact: document.getElementById('contact').value.trim(),
      note: document.getElementById('note').value.trim(),
      items, lang: LANG
    })
  });
  const j = await r.json();
  if (!r.ok) { showToast(j.error || 'Error'); load(); return; }
  saveOrder({ id: j.orderId, token: j.token, pw: j.view_password, time: Date.now(), buyer, total: items.reduce((a,i)=>a+i.qty,0) });
  showOrderResult(j, buyer, items);
  for (const k in cart) delete cart[k];
  document.getElementById('buyer').value=''; document.getElementById('contact').value=''; document.getElementById('note').value='';
  closeCart(false);
  load();
};

function saveOrder(o) {
  try {
    const list = JSON.parse(localStorage.getItem('myOrders')||'[]');
    list.unshift(o);
    localStorage.setItem('myOrders', JSON.stringify(list.slice(0,50)));
  } catch {}
}

function showOrderResult(j, buyer, items) {
  const url = location.origin + '/order?t=' + j.token;
  const totalQty = items.reduce((a,i)=>a+i.qty,0);
  const modal = document.createElement('div');
  modal.className = 'modal';
  modal.innerHTML = `
    <div class="receipt">
      <div class="receipt-head">
        <div class="check">✨</div>
        <h2>${T.success}</h2>
        <div style="margin-top:6px;font-size:14px;opacity:.9;font-weight:700;">#${j.orderId} · ${T.totalCount(totalQty)}</div>
      </div>
      <div class="receipt-body">
        <div class="label">${T.yourLink}</div>
        <div class="url">${url}</div>
        <div class="label">${T.yourPw}</div>
        <div class="pw">${j.view_password}</div>
      </div>
      <div class="receipt-actions">
        <button class="copy" id="copyBtn">${T.copy}</button>
        <button class="ok" id="closeBtn">OK</button>
      </div>
      <div class="receipt-tip">💡 ${T.receiptTip}</div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#copyBtn').onclick = async () => {
    try {
      const txt = `${T.yourLink}: ${url}\n${T.yourPw}: ${j.view_password}`;
      await navigator.clipboard.writeText(txt);
      const b = modal.querySelector('#copyBtn');
      b.textContent = T.copied; b.classList.add('done');
    } catch {}
  };
  modal.querySelector('#closeBtn').onclick = () => modal.remove();
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
}

document.getElementById('myBtn').onclick = () => {
  let list = [];
  try { list = JSON.parse(localStorage.getItem('myOrders')||'[]'); } catch {}
  const modal = document.createElement('div');
  modal.className = 'modal';
  const body = list.length === 0
    ? `<div class="empty" style="padding:30px;"><span class="ico">📋</span>${T.myEmpty}</div>`
    : list.map(o => `
        <div class="order-row" data-token="${o.token}" data-pw="${o.pw}">
          <div class="oid">#${o.id} · ${esc(o.buyer||'')}</div>
          <div class="meta">${new Date(o.time).toLocaleString()}</div>
          <div class="sum">${T.totalCount(o.total||0)}</div>
        </div>
      `).join('');
  modal.innerHTML = `
    <div class="receipt">
      <div class="receipt-head" style="background:linear-gradient(135deg,#dfe9ff,#b9d0ff);">
        <div style="font-size:48px;">📋</div>
        <h2>${T.myOrders}</h2>
      </div>
      <div class="orders-list">${body}</div>
      <div class="receipt-actions"><button class="ok" id="closeBtn">OK</button></div>
    </div>`;
  document.body.appendChild(modal);
  modal.querySelector('#closeBtn').onclick = () => modal.remove();
  modal.addEventListener('click', e => { if (e.target === modal) modal.remove(); });
  modal.querySelectorAll('.order-row').forEach(row => {
    row.onclick = () => { window.open('/order?t=' + row.dataset.token + '&pw=' + row.dataset.pw, '_blank'); };
  });
};

const bigBtn = document.getElementById('bigBtn');
const bigLabel = document.getElementById('bigLabel');
function applyBig(on) {
  document.body.classList.toggle('big', on);
  bigBtn.classList.toggle('on', on);
  bigLabel.textContent = on ? T.bigOn : T.bigOff;
  localStorage.setItem('bigText', on ? '1' : '0');
}
applyBig(localStorage.getItem('bigText') === '1');
bigBtn.onclick = () => applyBig(!document.body.classList.contains('big'));

load();
setInterval(load, 3000);
</script>
</body>
</html>
